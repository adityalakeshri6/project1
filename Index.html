<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalkboard Tic-Tac-Toe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  :root{
    --board: #1f2b22;
    --board-edge: #16201a;
    --chalk: #eef2ea;
    --chalk-dim: #b9c4b6;
    --chalk-pink: #f2a6b0;
    --chalk-yellow: #f0d78c;
    --frame: #6b4a35;
    --frame-dark: #4a3225;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100vh;
    background: radial-gradient(ellipse at top, #2a2420 0%, #17140f 70%);
    font-family: 'Space Mono', monospace;
    color: var(--chalk);
    display:flex; align-items:center; justify-content:center;
  }

  .room{
    padding: 32px 16px 64px;
    width:100%;
    display:flex; justify-content:center;
  }

  .frame{
    background: linear-gradient(160deg, var(--frame) 0%, var(--frame-dark) 100%);
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 0 0 3px rgba(0,0,0,0.2);
    max-width: 460px;
    width:100%;
  }

  .board-panel{
    background: var(--board);
    border-radius: 4px;
    padding: 26px 22px 22px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
    overflow:hidden;
  }

  .board-panel::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  h1{
    font-family:'Caveat', cursive;
    font-size: 2.6rem;
    font-weight:700;
    text-align:center;
    margin: 0 0 2px;
    color: var(--chalk);
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(238,242,234,0.15);
    transform: rotate(-1deg);
  }

  .subtitle{
    text-align:center;
    font-size: 0.68rem;
    color: var(--chalk-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.75;
  }

  .setup{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding: 10px 4px 4px;
  }

  .setup p{
    font-family:'Caveat', cursive;
    font-size: 1.5rem;
    margin: 0;
    color: var(--chalk);
  }

  .side-choice{ display:flex; gap:14px; }

  .chalk-btn{
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 1px;
    background: transparent;
    color: var(--chalk);
    border: 2px solid var(--chalk-dim);
    border-radius: 3px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chalk-btn:hover{
    border-color: var(--chalk);
    background: rgba(238,242,234,0.06);
    transform: translateY(-1px);
  }

  .chalk-btn:focus-visible{
    outline: 2px solid var(--chalk-yellow);
    outline-offset: 2px;
  }

  .chalk-btn.primary{
    border-color: var(--chalk-yellow);
    color: var(--chalk-yellow);
  }

  .status-line{
    text-align:center;
    font-size: 0.85rem;
    min-height: 22px;
    margin-bottom: 14px;
    color: var(--chalk-dim);
    letter-spacing: 0.5px;
  }

  .status-line.win{ color: var(--chalk-yellow); }
  .status-line.lose{ color: var(--chalk-pink); }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 320px;
    margin: 0 auto;
  }

  .cell{
    aspect-ratio: 1;
    background: rgba(255,255,255,0.02);
    border: 2px dashed rgba(238,242,234,0.25);
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-family:'Caveat', cursive;
    font-size: clamp(2.4rem, 10vw, 3.2rem);
    line-height: 1;
    color: var(--chalk);
    transition: background 0.15s ease, transform 0.08s ease;
    user-select:none;
  }

  .cell:hover:not(.taken):not(.disabled){
    background: rgba(238,242,234,0.06);
  }

  .cell:active:not(.taken):not(.disabled){ transform: scale(0.96); }

  .cell.disabled{ cursor: default; }

  .cell.mark-X{ color: var(--chalk-yellow); }
  .cell.mark-O{ color: var(--chalk-pink); }

  .cell:focus-visible{
    outline: 2px solid var(--chalk-yellow);
    outline-offset: -2px;
  }

  .controls{
    display:flex; justify-content:center; gap:12px;
    margin-top: 22px;
  }

  .footer-note{
    text-align:center;
    font-size: 0.62rem;
    color: var(--chalk-dim);
    opacity: 0.55;
    margin-top: 18px;
    letter-spacing: 1px;
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .cell, .chalk-btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="room">
  <div class="frame">
    <div class="board-panel">
      <h1>Tic-Tac-Toe</h1>
      <div class="subtitle">unbeatable minimax opponent</div>

      <div id="setup" class="setup">
        <p>Pick your chalk:</p>
        <div class="side-choice">
          <button class="chalk-btn primary" id="pickX">Play as X</button>
          <button class="chalk-btn" id="pickO">Play as O</button>
        </div>
      </div>

      <div id="gameArea" class="hidden">
        <div id="statusLine" class="status-line">Your move</div>
        <div id="grid" class="grid"></div>
        <div class="controls">
          <button class="chalk-btn" id="restartBtn">New game</button>
        </div>
      </div>

      <div class="footer-note">best you can do is draw</div>
    </div>
  </div>
</div>

<script>
(function(){
  // null = empty cell, keeping it simple instead of using ""
  const EMPTY = null;
  let board, humanSymbol, aiSymbol, turn, gameOver;

  const setupEl = document.getElementById('setup');
  const gameArea = document.getElementById('gameArea');
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('statusLine');
  const restartBtn = document.getElementById('restartBtn');

  document.getElementById('pickX').addEventListener('click', () => startGame('X'));
  document.getElementById('pickO').addEventListener('click', () => startGame('O'));
  restartBtn.addEventListener('click', () => {
    gameArea.classList.add('hidden');
    setupEl.classList.remove('hidden');
  });

  function startGame(symbol){
    humanSymbol = symbol;
    aiSymbol = symbol === 'X' ? 'O' : 'X';
    board = Array(9).fill(EMPTY);
    turn = 'X';
    gameOver = false;

    setupEl.classList.add('hidden');
    gameArea.classList.remove('hidden');
    statusEl.className = 'status-line';
    renderBoard();
    updateStatus();

    if (turn === aiSymbol) {
      window.setTimeout(aiMove, 300);
    }
  }

  function renderBoard(){
    gridEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' taken mark-' + val : '') + (gameOver ? ' disabled' : '');
      cell.tabIndex = 0;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', 'cell ' + (i+1) + (val ? ', ' + val : ', empty'));
      cell.textContent = val || '';
      if (!val && !gameOver && turn === humanSymbol) {
        cell.addEventListener('click', () => humanMove(i));
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); humanMove(i); }
        });
      }
      gridEl.appendChild(cell);
    });
  }

  function humanMove(i){
    if (board[i] || gameOver || turn !== humanSymbol) return; // cell taken or not your turn
    board[i] = humanSymbol;
    afterMove();
  }

  function afterMove(){
    renderBoard();
    const result = checkWinner(board);
    if (result) {
      finishGame(result);
      return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    updateStatus();
    if (turn === aiSymbol && !gameOver) {
      window.setTimeout(aiMove, 350);
    }
  }

  function aiMove(){
    if (gameOver) return;
    statusEl.textContent = 'AI is thinking...';
    const move = bestMove(board, aiSymbol);
    if (move !== null) {
      board[move] = aiSymbol;
    }
    afterMove();
  }

  function updateStatus(){
    if (gameOver) return;
    statusEl.className = 'status-line';
    statusEl.textContent = turn === humanSymbol ? 'Your move' : 'AI is thinking...';
  }

  function finishGame(result){
    gameOver = true;
    renderBoard();
    if (result === 'Draw') {
      statusEl.textContent = "It's a draw!";
      statusEl.className = 'status-line';
    } else if (result === humanSymbol) {
      statusEl.textContent = 'You won! 🎉';
      statusEl.className = 'status-line win';
    } else {
      statusEl.textContent = 'AI wins.';
      statusEl.className = 'status-line lose';
    }
  }

  // all 8 ways to win on a 3x3 board (rows, cols, 2 diagonals)
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function checkWinner(b){
    for (const [a,c,d] of LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    if (b.every(v => v !== EMPTY)) return 'Draw';
    return null; // still going
  }

  // classic minimax - ai maximizes, human minimizes. small enough board
  // that we don't need alpha-beta pruning or anything fancy
  function minimax(b, isMaximizing, aiSym, humanSym){
    const result = checkWinner(b);
    if (result === aiSym) return 1;
    if (result === humanSym) return -1;
    if (result === 'Draw') return 0;

    if (isMaximizing) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === EMPTY) {
          b[i] = aiSym;
          best = Math.max(best, minimax(b, false, aiSym, humanSym));
          b[i] = EMPTY;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === EMPTY) {
          b[i] = humanSym;
          best = Math.min(best, minimax(b, true, aiSym, humanSym));
          b[i] = EMPTY;
        }
      }
      return best;
    }
  }

  function bestMove(b, aiSym){
    const humanSym = aiSym === 'X' ? 'O' : 'X';
    let bestScore = -Infinity;
    let move = null;
    for (let i = 0; i < 9; i++) {
      if (b[i] === EMPTY) {
        b[i] = aiSym;
        const score = minimax(b, false, aiSym, humanSym);
        b[i] = EMPTY;
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }
})();
</script>

</body>
</html>
